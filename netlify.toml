[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"