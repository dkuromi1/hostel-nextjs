                  - { label: "Alt", name: "alt", widget: "string" }
          - label: "Experiences"
            name: "experiences"
            widget: "object"
            fields:
              - label: "Metadata"
                name: "metadata"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }
              - { label: "Page Title", name: "pageTitle", widget: "string" }

  - name: "faqs"
    label: "FAQs"
    editor:
      preview: false
    files:
      - name: "faq_content"
        label: "FAQ Content"
        file: "content/faq.json"
        fields:
          - label: "FAQ Items"
            name: "faqItems"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "testimonials"
    label: "Testimonials"
    editor:
      preview: false
    files:
      - name: "testimonials_content"
        label: "Testimonials Content"
        file: "content/testimonials.json"
        fields:
          - label: "Reviews"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Source", name: "source", widget: "string" }
              - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5 }

  - name: "gallery"
    label: "Gallery"
    editor:
      preview: false
    files:
      - name: "gallery_content"
        label: "Gallery Content"
        file: "content/gallery.json"
        fields:
          - label: "Gallery Items"
            name: "galleryItems"
            widget: "list"
            fields:
