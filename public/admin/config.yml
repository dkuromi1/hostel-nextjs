backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "site_config"
        label: "Site Configuration"
        file: "content/settings.json"
        fields:
          - label: "Business"
            name: "business"
            widget: "object"
            fields:
              - { label: "Business Name", name: "name", widget: "string" }
              - { label: "Short Name", name: "shortName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Category", name: "category", widget: "string", default: "travel" }
          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - { label: "Full Address Label", name: "label", widget: "string" }
              - { label: "Title Suffix Summary", name: "summary", widget: "string", hint: "Used in titles like 'Business | Summary'" }
              - { label: "Street Address", name: "streetAddress", widget: "string" }
              - { label: "City / Locality", name: "addressLocality", widget: "string" }
              - { label: "Postal Code", name: "postalCode", widget: "string", required: false }
              - { label: "Country Code", name: "addressCountry", widget: "string", hint: "ISO country code, e.g. AL" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone (Display)", name: "phoneDisplay", widget: "string" }
              - { label: "Phone (Raw Number)", name: "phoneRaw", widget: "string", hint: "Format: 355685310744" }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
              - { label: "WhatsApp Community URL", name: "whatsappCommunityUrl", widget: "string", required: false }
              - label: "Contact Channels"
                name: "channels"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Channel ID", name: "id", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["whatsapp", "instagram", "bookingCom", "hostelworld"]
                  - label: "Style Priority"
                    name: "stylePriority"
                    widget: "select"
                    options: ["primary", "secondary", "tertiary"]
                  - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
          - label: "Booking & Messaging"
            name: "booking"
            widget: "object"
            fields:
              - { label: "WhatsApp URL", name: "whatsappUrl", widget: "string" }
              - { label: "Booking.com URL", name: "bookingUrl", widget: "string", required: false }
              - { label: "Hostelworld URL", name: "hostelworldUrl", widget: "string", required: false }
              - { label: "Booking.com Rating", name: "bookingRating", widget: "string", required: false }
              - { label: "Hostelworld Rating", name: "hostelworldRating", widget: "string", required: false }
              - { label: "Hostelworld Reviews", name: "hostelworldReviews", widget: "string", required: false }
              - label: "Booking Channels"
                name: "channels"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Channel ID", name: "id", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["whatsapp", "instagram", "bookingCom", "hostelworld"]
                  - label: "Style Priority"
                    name: "stylePriority"
                    widget: "select"
                    options: ["primary", "secondary", "tertiary"]
                  - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
          - label: "Operations"
            name: "operations"
            widget: "object"
            fields:
              - { label: "Breakfast Hours", name: "breakfastHours", widget: "string", required: false }
              - { label: "Check-in Hours", name: "checkInHours", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Keywords", name: "baseKeywords", widget: "list", summary: "{{fields.item}}" }
              - { label: "Title Suffix", name: "titleSuffix", widget: "string" }
              - { label: "Locale", name: "locale", widget: "string", default: "en_US" }
              - { label: "Default OG Image", name: "ogImage", widget: "image" }
          - label: "Branding"
            name: "branding"
            widget: "object"
            fields:
              - { label: "Primary Logo (WebP)", name: "logoWebp", widget: "string" }
              - { label: "Primary Logo (PNG)", name: "logoPng", widget: "string" }
              - { label: "Favicon", name: "favicon", widget: "string" }
              - { label: "Apple Touch Icon", name: "appleTouchIcon", widget: "string" }
              - { label: "Manifest Theme Color", name: "manifestThemeColor", widget: "string", default: "#020617" }
              - { label: "Manifest Background Color", name: "manifestBackgroundColor", widget: "string", default: "#f6f7f2" }
          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Volunteers Needed", name: "volunteersNeeded", widget: "boolean", default: false }
          - label: "Structured Data"
            name: "schema"
            widget: "object"
            fields:
              - { label: "Schema Type", name: "type", widget: "string", default: "Hostel" }
              - { label: "Price Range", name: "priceRange", widget: "string", required: false }
              - { label: "Same As URLs", name: "sameAs", widget: "list", summary: "{{fields.item}}", required: false }
              - { label: "Schema Images", name: "images", widget: "list", summary: "{{fields.item}}" }
              - { label: "Amenities", name: "amenities", widget: "list", summary: "{{fields.item}}" }
      
      - name: "navigation"
        label: "Navigation Links"
        file: "content/navigation.json"
        fields:
          - label: "Links"
            name: "navLinks"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }

  - name: "rooms"
    label: "Rooms"
    delete: false
    editor:
      preview: false
    files:
      - name: "room_types"
        label: "Room Types"
        file: "content/rooms.json"
        fields:
          - label: "Rooms"
            name: "roomTypes"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Main Image", name: "image", widget: "image" }
              - { label: "Image Alt Text", name: "alt", widget: "string" }
              - { label: "Bullets", name: "bullets", widget: "list" }
              - label: "Carousel Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Alt", name: "alt", widget: "string" }

  - name: "content"
    label: "Site Content"
    delete: false
    editor:
      preview: false
    files:
      - name: "homepage"
        label: "Homepage Sections"
        file: "content/homepage.json"
        fields:
          - { label: "Hero Highlights", name: "heroHighlights", widget: "list" }
          - { label: "Quick Facts", name: "quickFacts", widget: "list" }
          - { label: "Shared Amenities", name: "sharedAmenities", widget: "list" }
          - { label: "Free Services", name: "freeServices", widget: "list" }
          - { label: "Paid Services", name: "paidServices", widget: "list" }
          - label: "Reasons to Extend"
            name: "extendReasons"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Experience Pillars"
            name: "experiencePillars"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Event Cards"
            name: "eventCards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - { label: "Booking Award Image", name: "bookingAwardImage", widget: "image" }

      - name: "site_copy"
        label: "Page & Footer Copy"
        file: "content/site-copy.json"
        fields:
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Social Labels"
                name: "socialLabels"
                widget: "object"
                fields:
                  - { label: "Instagram", name: "instagram", widget: "string" }
                  - { label: "Booking", name: "booking", widget: "string" }
                  - { label: "Hostelworld", name: "hostelworld", widget: "string" }
              - { label: "Explore Label", name: "exploreLabel", widget: "string" }
              - { label: "Community Label", name: "communityLabel", widget: "string" }
              - { label: "Community Caption", name: "communityCaption", widget: "string" }
              - { label: "Community Button", name: "communityButton", widget: "string" }
              - { label: "Details Label", name: "detailsLabel", widget: "string" }
              - { label: "Breakfast Prefix", name: "breakfastPrefix", widget: "string" }
              - { label: "Details Summary", name: "detailsSummary", widget: "text" }
              - { label: "Credit", name: "credit", widget: "string" }
          - label: "Error Page"
            name: "errorPage"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Reload Label", name: "reloadLabel", widget: "string" }
              - { label: "Contact Label", name: "contactLabel", widget: "string" }
          - label: "Not Found Page"
            name: "notFoundPage"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Home Button", name: "homeLabel", widget: "string" }
              - { label: "Contact Button", name: "contactLabel", widget: "string" }
          - label: "Home"
            name: "home"
            widget: "object"
            fields:
              - label: "Metadata"
                name: "metadata"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }
              - label: "Guest Ratings"
                name: "guestRatings"
