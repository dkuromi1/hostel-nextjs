                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Hero Images"
                name: "heroImages"
                widget: "object"
                fields:
                  - { label: "Street Alt", name: "streetAlt", widget: "string" }
                  - { label: "Social Alt", name: "socialAlt", widget: "string" }
              - label: "Contact Details"
                name: "contactDetails"
                widget: "object"
                fields:
