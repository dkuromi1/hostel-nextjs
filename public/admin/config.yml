                  - { label: "Background Alt", name: "backgroundAlt", widget: "string" }
              - label: "Atmosphere"
                name: "atmosphere"
                widget: "object"
                fields:
                  - { label: "Direct Booking Label", name: "directBookingLabel", widget: "string" }
                  - { label: "Direct Booking Title", name: "directBookingTitle", widget: "string" }
                  - { label: "Direct Booking Title Mobile", name: "directBookingTitleMobile", widget: "string" }
                  - { label: "Direct Booking Description", name: "directBookingDescription", widget: "text" }
                  - { label: "Direct Booking Description Mobile", name: "directBookingDescriptionMobile", widget: "text" }
                  - { label: "Direct Booking Button", name: "directBookingButton", widget: "string" }
                  - { label: "Rooftop Eyebrow", name: "rooftopEyebrow", widget: "string" }
                  - { label: "Rooftop Title", name: "rooftopTitle", widget: "string" }
                  - { label: "Rooftop Image Alt", name: "rooftopImageAlt", widget: "string" }
                  - { label: "Room Image Alt", name: "roomImageAlt", widget: "string" }
              - label: "Rooms Section"
                name: "roomsSection"
                widget: "object"
                fields:
                  - { label: "Eyebrow Prefix", name: "titleEyebrowPrefix", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
                  - { label: "Details Label", name: "detailsLabel", widget: "string" }
              - label: "Included Stay"
