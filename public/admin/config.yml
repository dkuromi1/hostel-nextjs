                fields:
                  - { label: "Section Label", name: "label", widget: "string" }
                  - { label: "Top Rated Label", name: "topRatedLabel", widget: "string" }
                  - { label: "Booking Source Label", name: "bookingSourceLabel", widget: "string" }
                  - { label: "Booking Award Title", name: "bookingAwardTitle", widget: "string" }
                  - { label: "Booking Score Suffix", name: "bookingScoreSuffix", widget: "string" }
                  - { label: "Booking Description", name: "bookingDescription", widget: "text" }
                  - { label: "Hostelworld Source Label", name: "hostelworldSourceLabel", widget: "string" }
                  - { label: "Hostelworld Title", name: "hostelworldTitle", widget: "string" }
                  - { label: "Hostelworld Reviews Suffix", name: "hostelworldReviewsSuffix", widget: "string" }
