<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Scodrinon</title>
    <meta
      name="description"
      content="You are offline right now. Reconnect to keep browsing Scodrinon."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.92);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
      }

      p {
        margin: 0 0 1rem;
        line-height: 1.6;
        color: #cbd5e1;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #f59e0b;
        color: #111827;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        The latest version of the page is not available right now. Reconnect to continue
        browsing rooms, experiences, and booking details.
      </p>
      <p>If you just lost connection, try refreshing again in a moment.</p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
